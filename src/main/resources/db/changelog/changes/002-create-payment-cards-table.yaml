databaseChangeLog:
  - changeSet: 
      id: 002-create-payment-cards-table
      author: ma_yak
      changes:
        - createTable:
            tableName: payment_cards
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: version, type: BIGINT, constraints: { nullable: false } }
              - column: { name: user_id, type: UUID, constraints: { nullable: false, foreignKeyName: fk_payment_cards_users, references: users(id) } }
              - column: { name: number, type: VARCHAR(32), constraints: { nullable: false, unique: true } }
              - column: { name: holder, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: expiration_date, type: DATE, constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMPTZ, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMPTZ , constraints: { nullable: false } }
        - createIndex:
            indexName: idx_payment_cards_user_id
            tableName: payment_cards
            columns:
              - column: { name: user_id }